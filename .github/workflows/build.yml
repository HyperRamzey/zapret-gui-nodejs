# Build + validate zapret-gui (Windows x64 + Linux x64)
#
# Triggers:
# - push to main      -> build installers, upload as artifacts
# - workflow_dispatch -> manual build
#
# NOTE: tags v* intentionally do NOT trigger this workflow. Releases are
# built + published solely by release.yml — running both used to publish
# the installer twice (plus a stray .blockmap) into the same Release.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron toolchain
        # electron-builder downloads Electron + NSIS/winCodeSign tooling from
        # GitHub releases on every cold run; a warm cache turns a transient
        # 504 from that download step into a non-issue.
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-tools-${{ runner.os }}-

      - name: Verify bundled assets
        shell: pwsh
        run: |
          if (-not (Test-Path 'bundled-assets/bin/winws.exe')) {
            Write-Error 'bundled-assets/bin/winws.exe missing. Commit bundled-assets/ or add a step that downloads the upstream release ZIP.'
            exit 1
          }
          if (-not (Test-Path 'bundled-assets/WinDivert64.sys') -and -not (Test-Path 'bundled-assets/bin/WinDivert64.sys')) {
            Write-Error 'WinDivert64.sys missing under bundled-assets/bin/.'
            exit 1
          }
          npm run generate:strategies
          npm test
          npm run lint

      - name: Build installer
        # Retried: the packaging step downloads external toolchain bits and
        # occasionally hits transient HTTP 5xx from the mirror.
        # (nick-fields/retry is stuck on the Node 20 runtime, so the retry
        # loop is inline pwsh instead of a third-party action.)
        shell: pwsh
        timeout-minutes: 75
        run: |
          $attempt = 0
          $maxAttempts = 3
          while ($true) {
            $attempt++
            npm run build:win
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge $maxAttempts) {
              Write-Error "npm run build:win failed after $maxAttempts attempts."
              exit 1
            }
            Write-Warning "Build attempt $attempt/$maxAttempts failed, retrying in 10s…"
            Start-Sleep -Seconds 10
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zapret-gui-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        # electron-builder needs rpm tooling for the .rpm target and fakeroot
        # for deterministic file ownership inside the .deb.
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron toolchain
        # Same rationale as Windows: Electron + fpm/packaging downloads are
        # retried below, a warm cache skips them entirely on reruns.
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-tools-${{ runner.os }}-

      - name: Verify bundled assets
        run: |
          if [ ! -f 'bundled-assets/bin/nfqws' ]; then
            echo 'bundled-assets/bin/nfqws missing. Commit bundled-assets/ or add a step that downloads the upstream release ZIP.' >&2
            exit 1
          fi
          if [ ! -x 'bundled-assets/bin/nfqws' ]; then
            echo 'bundled-assets/bin/nfqws lost its +x bit — fixing for this build (check .gitattributes / fileMode).' >&2
            chmod +x bundled-assets/bin/nfqws
          fi
          if [ ! -f 'build/app-icon.png' ]; then
            echo 'build/app-icon.png missing (referenced by electron-builder.yml linux.icon).' >&2
            exit 1
          fi
          npm run generate:strategies
          npm test
          npm run lint

      - name: Build packages
        # Retried inline in bash: nick-fields/retry is stuck on Node 20.
        timeout-minutes: 75
        run: |
          attempt=0
          maxAttempts=3
          while true; do
            attempt=$((attempt + 1))
            if npm run build:linux; then break; fi
            if [ "$attempt" -ge "$maxAttempts" ]; then
              echo "npm run build:linux failed after $maxAttempts attempts." >&2
              exit 1
            fi
            echo "Build attempt $attempt/$maxAttempts failed, retrying in 10s…"
            sleep 10
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zapret-gui-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
          if-no-files-found: error
